<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 798" width="2460" height="1596"><!-- svg-source:excalidraw --><metadata/><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="1230" height="798" fill="#ffffff"/><g transform="translate(40 40) rotate(0 575 21.6)"><text x="0" y="30.240625" font-family="Helvetica, Segoe UI Emoji" font-size="32px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">一次模型调用：基础部分 + 对话记录</text></g><g transform="translate(40 92) rotate(0 575 13.5)"><text x="0" y="18.900390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">从上到下为逻辑组织顺序；工具定义可由独立接口字段承载</text></g><g stroke-linecap="round" transform="translate(40 148) rotate(0 375 174)"><path d="M32 0 C289.07 0, 546.14 0, 718 0 C739.33 0, 750 10.67, 750 32 C750 115.96, 750 199.92, 750 316 C750 337.33, 739.33 348, 718 348 C506.68 348, 295.35 348, 32 348 C10.67 348, 0 337.33, 0 316 C0 242.57, 0 169.14, 0 32 C0 10.67, 10.67 0, 32 0" stroke="none" stroke-width="0" fill="#eff6ff"/><path d="M32 0 C170.25 0, 308.49 0, 718 0 M32 0 C173.25 0, 314.5 0, 718 0 M718 0 C739.33 0, 750 10.67, 750 32 M718 0 C739.33 0, 750 10.67, 750 32 M750 32 C750 126.65, 750 221.3, 750 316 M750 32 C750 102.42, 750 172.85, 750 316 M750 316 C750 337.33, 739.33 348, 718 348 M750 316 C750 337.33, 739.33 348, 718 348 M718 348 C503.3 348, 288.61 348, 32 348 M718 348 C468.92 348, 219.84 348, 32 348 M32 348 C10.67 348, 0 337.33, 0 316 M32 348 C10.67 348, 0 337.33, 0 316 M0 316 C0 251.15, 0 186.29, 0 32 M0 316 C0 229.31, 0 142.62, 0 32 M0 32 C0 10.67, 10.67 0, 32 0 M0 32 C0 10.67, 10.67 0, 32 0" stroke="#93c5fd" stroke-width="2" fill="none"/></g><g transform="translate(64 168) rotate(0 350 16.200000000000003)"><text x="0" y="22.680468750000003" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">每轮调用的基础部分</text></g><g transform="translate(64 221) rotate(0 350 15.525000000000006)"><text x="0" y="21.73544921875" font-family="Helvetica, Segoe UI Emoji" font-size="23px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1  指令</text></g><g transform="translate(64 255) rotate(0 350 13.5)"><text x="0" y="18.900390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">每轮必带，位于最前面</text></g><g transform="translate(64 307) rotate(0 350 15.525000000000006)"><text x="0" y="21.73544921875" font-family="Helvetica, Segoe UI Emoji" font-size="23px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">2  当前任务状态</text></g><g transform="translate(64 341) rotate(0 350 13.5)"><text x="0" y="18.900390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">有状态管理时带入最新相关状态，通常在指令之后</text></g><g transform="translate(64 393) rotate(0 350 15.525000000000006)"><text x="0" y="21.73544921875" font-family="Helvetica, Segoe UI Emoji" font-size="23px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3  本轮可用工具定义</text></g><g transform="translate(64 427) rotate(0 350 13.5)"><text x="0" y="18.900390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">每轮提供本轮暴露的工具；工具集合可按需选择</text></g><g stroke-linecap="round" transform="translate(40 518) rotate(0 375 90)"><path d="M32 0 C197.13 0, 362.26 0, 718 0 C739.33 0, 750 10.67, 750 32 C750 57.21, 750 82.42, 750 148 C750 169.33, 739.33 180, 718 180 C491.95 180, 265.9 180, 32 180 C10.67 180, 0 169.33, 0 148 C0 107.63, 0 67.26, 0 32 C0 10.67, 10.67 0, 32 0" stroke="none" stroke-width="0" fill="#f0fdf4"/><path d="M32 0 C173.03 0, 314.07 0, 7