, Segoe UI Emoji" font-size="24px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">循环发生在包装器内部：调用 → 检查 → 等待 → 再次调用。</text></g><g transform="translate(40 740) rotate(0 436 14)"><text x="0" y="19.400390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">成功立即返回；不可重试、预算耗尽或取消则返回错误。业务负责错误分类与重复执行的安全性。</text></g></svg>