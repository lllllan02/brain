<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 的中断恢复机制</title><style>body{margin:0;background:#fff} .diagram-container{width:100%;overflow-x:auto} svg{display:block;width:100%;min-width:1600px;font-family:Geist,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.serif{font-family:"Instrument Serif","Songti SC",serif}@media print{.diagram-container{overflow:visible}svg{min-width:0}}</style><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="recovery-title recovery-desc"><title id="recovery-title">Agent 的中断恢复机制</title><desc id="recovery-desc">以草稿审批发布为例，沿时间展示原进程保存检查点、进程退出而状态保留、审批更新状态、新进程读取状态后继续发布。底部解释外部发布成功但本地回执未保存的重复执行窗口。</desc><defs><marker id="recovery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4f5d75" stroke-width="1.3"/></marker></defs><rect width="1600" height="1000" fill="white"/><text x="64" y="56" font-size="16" fill="#5a6580" font-weight="500">HORIZON  /  AGENT MECHANISMS</text><text x="64" y="112" font-size="40" fill="#2d3142" font-weight="500" class="serif">进程可以退出，任务依靠检查点继续</text><text x="64" y="152" font-size="22" fill="#4f5d75" font-weight="400">示例：生成草稿 → 等待审批 → 发布。检查点同时保存业务数据与执行位置。</text><text x="64" y="216" font-size="26" fill="#2d3142" font-weight="600">保存进度</text><text x="64" y="248" font-size="18" fill="#5a6580" font-weight="400">原工作进程 A</text><text x="448" y="216" font-size="26" fill="#2d3142" font-weight="600">中断与等待</text><text x="448" y="248" font-size="18" fill="#5a6580" font-weight="400">没有工作进程也能等待</text><text x="832" y="216" font-size="26" fill="#2d3142" font-weight="600">满足恢复条件</text><text x="832" y="248" font-size="18" fill="#5a6580" font-weight="400">审批入口</text><text x="1216" y="216" font-size="26" fill="#2d3142" font-weight="600">接续执行</text><text x="1216" y="248" font-size="18" fill="#5a6580" font-weight="400">调度器 → 新工作进程 B</text><path d="M392 312 L436 312" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><path d="M776 312 L820 312" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><path d="M1160 312 L1204 312" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><rect x="64" y="276" width="320" height="100" rx="6" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><rect x="448" y="276" width="320" height="100" rx="6" fill="#fff" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="832" y="276" width="320" height="100" rx="6" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><rect x="1216" y="276" width="320" height="100" rx="6" fill="#fff" stroke="#4f5d75" stroke-width="1.2"/><text x="84" y="312" font-size="22" fill="#2d3142" font-weight="600">生成草稿 v3</text><text x="84" y="348" font-size="18" fill="#4f5d75" font-weight="400">准备审批单 A7</text><text x="468" y="312" font-size="22" fill="#2d3142" font-weight="600">进程 A 已退出</text><text x="468" y="348" font-size="18" fill="#4f5d75" font-weight="400">内存与连接可以释放</text><text x="852" y="312" font-size="22" fill="#2d3142" font-weight="600">收到「同意」</text><text x="852" y="348" font-size="18" fill="#4f5d75" font-weight="400">校验 A7 对应当前草稿 v3</text><text x="1236" y="312" font-size="22" fill="#2d3142" font-weight="600">读取状态，复用草稿 v3</text><text x="1236" y="348" font-size="18" fill="#4f5d75" font-weight="400">按执行位置调用发布工具</text><rect x="48" y="448" width="1504" height="240" rx="6" fill="#f6f7f8" stroke="#dce0e4" stroke-width="1.2"/><path d="M224 376 L224 472" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><text x="244" y="420" font-size="17" fill="#4f5d75" font-weight="400">写入成功后暂停</text><path d="M608 376 L608 472" fill="none" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5 5"/><text x="628" y="420" font-size="17" fill="#4f5d75" font-weight="400">存储中的记录仍在</text><path d="M992 376 L992 472" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><text x="1012" y="420" font-size="17" fill="#4f5d75" font-weight="400">保存审批结果</text><path d="M1120 472 V452 Q1120 444 1128 444 H1176 Q1184 444 1184 436 V356 Q1184 348 1192 348 H1216" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><text x="1136" y="432" font-size="17" fill="#4f5d75" font-weight="400">读取</text><path d="M1488 376 L1488 472" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><text x="1400" y="420" font-size="17" fill="#4f5d75" font-weight="400">保存回执</text><path d="M392 548 L436 548" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><path d="M776 548 L820 548" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><path d="M1160 548 L1204 548" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><rect x="64" y="472" width="320" height="152" rx="6" fill="#fff" stroke="#bf4520" stroke-width="1.2"/><rect x="448" y="472" width="320" height="152" rx="6" fill="#fff" stroke="#bfc0c0" stroke-width="1.2"/><rect x="832" y="472" width="320" height="152" rx="6" fill="#fff" stroke="#bfc0c0" stroke-width="1.2"/><rect x="1216" y="472" width="320" height="152" rx="6" fill="#fff" stroke="#bfc0c0" stroke-width="1.2"/><text x="80" y="508" font-size="20" fill="#2d3142" font-weight="600">任务 T42  ·  草稿 v3</text><text x="80" y="550" font-size="24" fill="#bf4520" font-weight="600">等待审批</text><text x="80" y="592" font-size="18" fill="#4f5d75" font-weight="400">下一步：等待 A7 决定</text><text x="464" y="508" font-size="20" fill="#2d3142" font-weight="600">任务 T42  ·  草稿 v3</text><text x="464" y="550" font-size="24" fill="#2d3142" font-weight="600">等待审批</text><text x="464" y="592" font-size="18" fill="#4f5d75" font-weight="400">下一步：仍等待 A7 决定</text><text x="848" y="508" font-size="20" fill="#2d3142" font-weight="600">任务 T42  ·  草稿 v3</text><text x="848" y="550" font-size="24" fill="#2d3142" font-weight="600">可执行：发布</text><text x="848" y="592" font-size="18" fill="#4f5d75" font-weight="400">审批：A7 同意 v3</text><text x="1232" y="508" font-size="20" fill="#2d3142" font-weight="600">任务 T42  ·  草稿 v3</text><text x="1232" y="550" font-size="24" fill="#2d3142" font-weight="600">已完成</text><text x="1232" y="592" font-size="18" fill="#4f5d75" font-weight="400">发布回执：已持久保存</text><text x="68" y="660" font-size="18" fill="#2d3142" font-weight="600">持久存储中的状态快照</text><text x="448" y="660" font-size="20" fill="#4f5d75" font-weight="400">同一任务、同一份草稿；状态变化决定是否可运行，以及从哪里继续。</text><path d="M1488 396 L1568 396" fill="none" stroke="#4f5d75" stroke-width="1.5"/><path d="M1568 396 L1568 732" fill="none" stroke="#4f5d75" stroke-width="1.5"/><path d="M1568 732 L1536 732" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#recovery-arrow)"/><text x="64" y="732" font-size="24" fill="#2d3142" font-weight="600">恢复的边界</text><text x="64" y="772" font-size="20" fill="#4f5d75" font-weight="400">意外退出：从最近可靠的检查点接手，</text><text x="64" y="804" font-size="20" fill="#4f5d75" font-weight="400">尚未保存的工作可能重做。</text><text x="64" y="844" font-size="20" fill="#4f5d75" font-weight="400">主动等待：恢复条件未满足，就继续等待；</text><text x="64" y="876" font-size="20" fill="#4f5d75" font-weight="400">进程重启本身不会让任务获准发布。</text><rect x="680" y="708" width="856" height="196" rx="6" fill="#fff7f3" stroke="#bf4520" stroke-width="1.2"/><text x="704" y="748" font-size="23" fill="#bf4520" font-weight="600">故障窗口：远端已发布成功，本地回执尚未保存</text><text x="704" y="788" font-size="21" fill="#2d3142" font-weight="500">远端：已有发布结果     ≠     本地：仍显示未完成</text><text x="704" y="828" font-size="20" fill="#4f5d75" font-weight="400">此时崩溃 → 恢复后可能再次调用发布。</text><text x="704" y="868" font-size="20" fill="#4f5d75" font-weight="400">处理：接收端按稳定操作 ID 去重，或先核对远端结果。</text><path d="M64 936 L1536 936" fill="none" stroke="#4f5d75" stroke-width="1.5"/><text x="64" y="972" font-size="21" fill="#2d3142" font-weight="500">检查点提供恢复依据；调度器安排继续执行；业务处理外部操作的重复风险。</text></svg></div></html>
