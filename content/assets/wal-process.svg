tate(0 99 14.300000000000011)"><text x="0" y="20.2404296875" font-family="Helvetica, Segoe UI Emoji" font-size="22px" fill="#b91c1c" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">日志持久化之前断电</text></g><g transform="translate(260 661) rotate(0 152 24.69999999999999)"><text x="0" y="17.48037109375" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">修改仍可能丢失。</text><text x="0" y="42.18037109375" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">同步持久化提交此时不应确认成功。</text></g><g transform="translate(730 623) rotate(0 165 14.300000000000011)"><text x="0" y="20.2404296875" font-family="Helvetica, Segoe UI Emoji" font-size="22px" fill="#047857" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">日志已落盘、数据页未写回时断电</text></g><g transform="translate(730 661) rotate(0 171 24.69999999999999)"><text x="0" y="17.48037109375" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">内存丢失，但已提交的 120 可恢复。</text><text x="0" y="42.18037109375" font-family="Helvetica, Segoe UI Emoji" font-size="19px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">无需为确认成功，立刻写回所有数据页。</text></g><g transform="translate(40 749) rotate(0 396 14.300000000000011)"><text x="0" y="20.2404296875" font-family="Helvetica, Segoe UI Emoji" font-size="22px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">收益来自：先付出日志顺序追加与同步的成本，保留脏页延后、批量写回的空间。</text></g><g transform="translate(40 795) rotate(0 425 11.050000000000011)"><text x="0" y="15.64033203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">示意不按时间比例绘制。假设数据页延后写回、无其他恢复副本、持久存储完好；不表示每次刷脏都比刷日志慢。</text></g></svg>