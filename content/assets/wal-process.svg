<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1373.72 857.1" width="2747.44" height="1714.2"><!-- svg-source:excalidraw --><metadata/><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="1373.72" height="857.1" fill="#ffffff"/><g transform="translate(40 40) rotate(0 251.84000000000003 20.8)"><text x="0" y="29.440625" font-family="Helvetica, Segoe UI Emoji" font-size="32px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">WAL：让提交不用一直等到脏页写回</text></g><g transform="translate(40 93) rotate(0 433.86 13.649999999999999)"><text x="0" y="19.32041015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">缓冲池先积累修改，再按策略批量刷脏；同一页的多次修改可以合并写回，减少数据页 I/O。</text></g><g transform="translate(40 136) rotate(0 273 13.650000000000006)"><text x="0" y="19.32041015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">代价：从修改内存到数据页落盘，中间可能隔着较长时间。</text></g><g transform="translate(170 205) rotate(0 101.22 27.299999999999997)"><text x="0" y="19.32041015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">修改缓冲池</text><text x="0" y="46.62041015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">页变脏：100 → 120</text></g><g stroke-linecap="round"><g transform="translate(255 270) rotate(0 0 127.5)"><path d="M0 0 C0 51.12, 0 102.24, 0 255" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="8 9.5"/></g></g><mask/><g transform="translate(480 205) rotate(0 125 27.299999999999997)"><text x="0" y="19.32041015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#047857" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">有 WAL：必要日志落盘</text><text x="0" y="46.62041015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#047857" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">可确认同步提交</text></g><g stroke-linecap="round"><g transform="translate(585 270) rotate(0 0 127.5)"><path d="M0 0 C0 51.12, 0 102.24, 0 255" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="8 9.5"/></g></g><mask/><g transform="translate(1180 205) rotate(0 76.86000000000001 27.299999999999997)"><text x="0" y="19.32041015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">按策略刷脏</text><text x="0" y="46.62041015625" font-family="Helvetica, Segoe UI Emoji" font-size="21px" fill="#1e40af" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">数据页写成 120</text></g><g stroke-linecap="round"><g transform="translate(1265 270) rotate(0 0 127.5)"><path d="M0 0 C0 51.12, 0 102.25, 0 255" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-dasharray="8 9.5"/></g></g><mask/><g transform="translate(40 306) rotate(0 51.84 15.599999999999994)"><text x="0" y="22.08046875" font-family="Helvetica, Segoe UI Emoji" font-size="24px" fill="#374151" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">没有 WAL</text></g><g stroke-linecap="round" transform="translate(255 295) rotate(0 505 36)"><path d="M18 0 C405.94 0, 793.88 0, 992 0 C1004 0, 1010 6, 1010 18 C1010 32.01, 1010 46.02, 1010 54 C1010 66, 1004 72, 992 72 C703.29 72, 414.58 72, 18 72 C6 72, 0 66, 0 54 C0 41.17, 0 28.33, 0 18 C0 6, 6 0, 18 0" stroke="none" stroke-width="0" fill="#fee2e2"/><path d="M18 0 C213.28 0, 408.56 0, 992 0 M18 0 C329.02 0, 640.03 0, 992 0 M992 0 C1004 0, 1010 6, 1010 18 M992 0 C1004 0, 1010 6, 1010 18 M1010 18 C1010 29.71, 1010 41.42, 1010 54 M1010 18 C1010 26.91, 1010 35.81, 1010 54 M1010 54 C1010 66, 1004 72, 992 72 M1010 54 C1010 66, 100