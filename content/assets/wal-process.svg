baseline="alphabetic">仍有丢失窗口</text></g><g stroke-linecap="round" transform="translate(585 420) rotate(0 340 36)"><path d="M18 0 C210.05 0, 402.1 0, 662 0 C674 0, 680 6, 680 18 C680 25.77, 680 33.55, 680 54 C680 66, 674 72, 662 72 C421.45 72, 180.9 72, 18 72 C6 72, 0 66, 0 54 C0 40.58, 0 27.17, 0 18 C0 6, 6 0, 18 0" stroke="none" stroke-width="0" fill="#d1fae5"/><path d="M18 0 C147.13 0, 276.27 0, 662 0 M18 0 C197.86 0, 377.72 0, 662 0 M662 0 C674 0, 680 6, 680 18 M662 0 C674 0, 680 6, 680 18 M680 18 C680 25.66, 680 33.32, 680 54 M680 18 C680 32.22, 680 46.44, 680 54 M680 54 C680 66, 674 72, 662 72 M680 54 C680 66, 674 72, 662 72 M662 72 C531.7 72, 401.39 72, 18 72 M662 72 C520.75 72, 379.49 72, 18 72 M18 72 C6 72, 0 66, 0 54 M18 72 C6 72, 0 66, 0 54 M0 54 C0 40.21, 0 26.42, 0 18 M0 54 C0 40.03, 0 26.07, 0 18 M0 18 C0 6, 6 0, 18 0 M0 18 C0 6, 6 0, 18 0" stroke="#047857" stroke-width="1.5" fill="none"/></g><g transform="translate(620 442) rotate(0 242 14.300000000000011)"><text x="0" y="20.2404296875" font-family="Helvetica, Segoe UI Emoji" font-size="22px" fill="#047857" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">数据页仍可保持脏：断电后用日志恢复已提交修改</text></g><g transform="translate(267 379) rotate(0 54 11.699999999999989)"><text x="0" y="16.560351562500003" font-family="Helvetica, Segoe UI Emoji" font-size="18px" fill="#64748b" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">修改只在内存</text></g><g stroke-linecap="round"><g transform="translate(415 495) rotate(0 0 35)"><path d="M0 0 C0 14.04, 0 28.07, 0 70 M0 0 C0 25.71, 0 51.42, 0 70" stroke="#94a3b8" stroke-width="1.5" fill="none"/></g></g><mask/><g stroke-linecap="round" transform="translate(397 570) rotate(0 18 18)"><path d="M36 18 C36 19.04, 35.91 20.1, 35.73 21.13 C35.55 22.15, 35.27 23.18, 34.91 24.16 C34.56 25.14, 34.11 26.1, 33.59 27 C33.07 27.9, 32.46 28.77, 31.79 29.57 C31.12 30.37, 30.37 31.12, 29.57 31.79 C28.77 32.46, 27.9 33.